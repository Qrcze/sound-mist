name: Build Windows

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
    - name: Restore dependencies
      run: dotnet restore SoundMist.sln
      
    - name: Build Windows project
      run: dotnet build SoundMist.Windows\SoundMist.Windows.csproj --configuration Release --no-restore
      
    - name: Publish Windows project
      run: dotnet publish SoundMist.Windows\SoundMist.Windows.csproj --configuration Release --no-build --output publish
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: soundmist-windows
        path: publish/
        retention-days: 30
